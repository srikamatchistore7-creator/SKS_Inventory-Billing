<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKS Inventory Management – Sri Kamatchi Stores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="pageStyle">@page{size:80mm auto;margin:0}</style>
<style>
:root{
  --bg:#EEF1F5;--surface:#FFFFFF;--surface2:#F5F7FA;--ink:#14213D;--muted:#5C677D;--line:#D9DFE8;
  --rail:#14213D;--rail-ink:#C3CDE0;--accent:#F2A900;--accent-ink:#2B1E00;
  --ok:#1B7A4B;--okbg:#DDF3E7;--warn:#8F5600;--warnbg:#FFEFCB;--bad:#B8322A;--badbg:#FBE1DE;
  --shadow:0 1px 2px rgba(20,33,61,.08),0 8px 24px rgba(20,33,61,.06);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C111B;--surface:#141C2B;--surface2:#1A2438;--ink:#E6EBF4;--muted:#93A0B8;--line:#27324A;
    --rail:#080C14;--rail-ink:#AEB9D0;--accent:#F5B61E;--accent-ink:#2B1E00;
    --ok:#4CC38A;--okbg:#12362A;--warn:#F2B14C;--warnbg:#3A2B0E;--bad:#FF7B72;--badbg:#3B1A1A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0C111B;--surface:#141C2B;--surface2:#1A2438;--ink:#E6EBF4;--muted:#93A0B8;--line:#27324A;
  --rail:#080C14;--rail-ink:#AEB9D0;--accent:#F5B61E;--accent-ink:#2B1E00;
  --ok:#4CC38A;--okbg:#12362A;--warn:#F2B14C;--warnbg:#3A2B0E;--bad:#FF7B72;--badbg:#3B1A1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.4 'Hind Madurai','Noto Sans Tamil',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
small{color:var(--muted);font-size:12.5px}
#app{display:flex;height:100%}
/* rail */
.rail{width:86px;background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;align-items:center;padding:12px 6px;gap:4px;flex:none;overflow-y:auto}
.mono{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:17px;letter-spacing:.5px;margin-bottom:10px;flex:none}
.nav{width:100%;border:0;background:transparent;color:inherit;padding:9px 2px 7px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:12px;font-weight:600}
.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .dot{position:absolute;margin:-4px 0 0 20px;background:var(--bad);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;line-height:15px}
.grow{flex:1}
/* main */
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:9px 18px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.top b{font-size:17px;letter-spacing:.3px}
.top span{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.top .clock{font-weight:600;color:var(--ink)}
.view{flex:1;min-height:0;overflow:auto;padding:16px 18px 24px}
#v-billing{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;overflow:hidden;padding-bottom:14px}
.bill-left{display:flex;flex-direction:column;min-height:0;gap:10px}
.bill-right{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px 10px 4px 4px;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:96px;position:relative;text-align:left}
.tab span{font-size:12px;color:var(--muted)}
.tab.on{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.tab i{position:absolute;right:6px;top:3px;font-style:normal;color:var(--muted);padding:0 4px;border-radius:5px}
.tab i:hover{background:var(--badbg);color:var(--bad)}
.tab.add{justify-content:center;color:var(--muted);border-style:dashed;min-width:auto}
/* entry */
.entry{position:relative;flex:none}
.entry input{width:100%;padding:13px 14px 13px 44px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);font-size:17px}
.entry svg{position:absolute;left:13px;top:13px;width:21px;height:21px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round}
.entry input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.suggest{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.sg{display:flex;gap:10px;align-items:center;padding:8px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.sg:last-child{border:0}
.sg.on,.sg:hover{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.sg .nm{flex:1;min-width:0}
.sg .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg .pr{font-weight:700}
.sg code{background:var(--surface2);border-radius:6px;padding:1px 6px;font-size:12px;color:var(--muted)}
/* cart */
.cart-wrap{flex:1;min-height:150px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;position:relative}
table{border-collapse:collapse;width:100%}
.cart th,.cart td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
.cart th{position:sticky;top:0;background:var(--surface2);font-size:12.5px;color:var(--muted);font-weight:600;z-index:1}
.cart td.n{color:var(--muted);width:34px}
.cart td.nm small{display:block}
.cart td.a,.cart th.a{text-align:right;font-weight:700}
.cart tr.flash td{background:color-mix(in srgb,var(--accent) 26%,transparent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:var(--surface2);width:30px;height:32px;cursor:pointer;font-size:18px}
.stepper button:hover{background:var(--line)}
.stepper input{width:68px;text-align:center;border:0;background:var(--surface);height:32px}
.cart input[data-f="rate"]{width:84px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);text-align:right}
.cart input.edited{border-color:var(--warn);background:var(--warnbg)}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px;width:30px;height:30px}
.x:hover{background:var(--badbg);color:var(--bad)}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
/* quick */
.quick{display:flex;gap:6px;flex-wrap:wrap;max-height:98px;overflow:auto;flex:none}
.qb{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 10px;cursor:pointer;text-align:left;line-height:1.2}
.qb:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.qb b{font-size:13.5px}
.qb small{display:block}
/* right panel */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 6px;cursor:pointer;font-weight:600}
.seg button small{margin-left:4px}
.seg button.on{background:var(--ink);color:var(--surface)}
.seg button.on small{color:inherit;opacity:.7}
.totalbox{background:var(--rail);color:#fff;border-radius:14px;padding:16px 18px}
.totalbox .lbl{color:var(--rail-ink);font-size:13px}
.totalbox .big{font-size:50px;font-weight:700;line-height:1.05;color:var(--accent);letter-spacing:-.5px}
.totalbox .big sup{font-size:24px;vertical-align:top;margin-right:3px;position:relative;top:7px}
.totalbox .sub{display:flex;justify-content:space-between;color:var(--rail-ink);font-size:13.5px;padding-top:2px}
.totalbox .save{margin-top:8px;font-size:13px;background:rgba(255,255,255,.1);border-radius:8px;padding:5px 9px;color:#C9F2DA}
.lines{display:grid;gap:5px;font-size:14px}
.lines div{display:flex;justify-content:space-between}
.field{display:grid;gap:3px;margin-bottom:9px}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=search],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.row.end{justify-content:flex-end;margin-top:14px}
.row>*{min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,.nav:focus-visible,.tab:focus-visible,.qb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(.95)}
.btn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn.xl{padding:15px;font-size:18px;width:100%}
kbd{background:var(--surface2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font:600 11.5px/1.5 inherit;color:var(--muted)}
.help{font-size:12.5px;color:var(--muted);line-height:1.9}
.help kbd{margin-right:2px}
/* generic pages */
h1{font-size:22px;margin:0 0 4px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-left:5px solid var(--ink)}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat.a{border-left-color:var(--accent)}.stat.g{border-left-color:var(--ok)}.stat.r{border-left-color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 250px)}
table.g th,table.g td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.g th{position:sticky;top:0;background:var(--surface2);font-size:12.5px;color:var(--muted);font-weight:600;z-index:1;white-space:nowrap}
table.g td.num,table.g th.num{text-align:right}
table.g tr:hover td{background:var(--surface2)}
table.g td small{display:block}
.cell{width:78px;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 6px;text-align:right}
.cell:hover{border-color:var(--line)}
.cell:focus{background:var(--surface)}
.cell.bad{color:var(--bad);border-color:var(--bad)}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.n{background:var(--surface2);color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}
.banner{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.banner .sp{flex:1}
.listrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.listrow:last-child{border:0}
.listrow>div:first-child{min-width:0}
.bars{width:100%;height:auto}
/* modal */
.backdrop{position:fixed;inset:0;background:rgba(8,12,20,.55);display:grid;place-items:center;z-index:50;padding:14px}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:min(480px,100%);max-height:calc(100vh - 28px);overflow:auto;box-shadow:var(--shadow)}
.modal.wide{width:min(720px,100%)}
.modal.sm{width:min(380px,100%)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.formgrid .full{grid-column:1/-1}
.paymodes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.paymodes button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 4px;cursor:pointer;font-weight:600}
.paymodes button small{display:block}
.paymodes button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.paymodes button.on small{color:inherit;opacity:.7}
.paytotal{font-size:44px;font-weight:700;text-align:center;line-height:1.1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:3px 12px;cursor:pointer;font-weight:600}
.chip:hover{border-color:var(--accent)}
.changebox{text-align:center;padding:10px;border-radius:10px;background:var(--okbg);color:var(--ok);font-weight:700;font-size:20px;margin-top:6px}
.changebox.due{background:var(--warnbg);color:var(--warn)}
.rcprev{background:#fff;color:#000;border:1px dashed #999;border-radius:6px;padding:8px;margin:10px auto;max-height:50vh;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:8px;justify-items:center;pointer-events:none}
.t{background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;max-width:92vw}
.t.err{background:var(--bad);color:#fff}.t.warn{background:var(--warn);color:#fff}.t.ok{background:var(--ok);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t.ok,:root:not([data-theme="light"]) .t.warn{color:#0C111B}}
/* receipt */
.rc{font-family:'Hind Madurai',Arial,sans-serif;color:#000;background:#fff;font-size:12px;line-height:1.35;width:72mm;margin:0 auto;padding:2mm 0}
.rc.w58{width:48mm;font-size:11px}
.rc .c{text-align:center}
.rc h4{margin:0;font-size:1.35em;text-transform:uppercase}
.rc hr{border:0;border-top:1px dashed #000;margin:4px 0}
.rc .it{margin-bottom:3px}
.rc .it .ln,.rc .tt{display:flex;justify-content:space-between;gap:6px}
.rc .it .nm{font-weight:600}
.rc .tt.big{font-size:1.4em;font-weight:700}
#receipt{display:none}
@media print{
  html,body{background:#fff!important;height:auto!important}
  :root{padding:0!important}
  #app,#modal-root,#toast{display:none!important}
  #receipt{display:block}
  .rc{padding:0}
}
/* mobile */
@media (max-width:900px){
  #app{flex-direction:column-reverse}
  .rail{width:100%;flex-direction:row;padding:4px 6px;overflow-x:auto;overflow-y:hidden}
  .rail .mono,.rail .grow{display:none}
  .nav{min-width:64px;width:auto;flex:1}
  .top .hide-s{display:none}
  #v-billing{grid-template-columns:1fr;overflow:auto;display:block}
  .bill-left,.bill-right{overflow:visible}
  .bill-right{margin-top:12px}
  .cart-wrap{min-height:200px;max-height:48vh}
  .formgrid{grid-template-columns:1fr}
  .tablewrap{max-height:none}
}
@media (prefers-reduced-motion:no-preference){.t{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>
<div id="app">
  <nav class="rail" id="rail"></nav>
  <div class="mainwrap">
    <header class="top">
      <b id="topShop">SRI KAMATCHI STORES</b><span id="topApp" class="hide-s">SKS INVENTORY MANAGEMENT</span>
      <span class="sp"></span>
      <span class="clock" id="clock"></span>
    </header>
    <section id="v-billing" class="view" hidden>
      <div class="bill-left">
        <div class="tabs" id="billTabs"></div>
        <div class="entry">
          <svg viewBox="0 0 24 24"><path d="M4 6v12M7 6v12M11 6v12M14 6v12M18 6v12M21 6v12"/></svg>
          <input id="entry" type="text" autocomplete="off" spellcheck="false" placeholder="Scan barcode, or type item name / quick code   (2.5*101 = 2.5 kg of code 101)">
          <div id="suggest" class="suggest" hidden></div>
        </div>
        <div class="cart-wrap" id="cartWrap">
          <table class="cart">
            <thead><tr><th>#</th><th>Item</th><th>Qty</th><th>Rate ₹</th><th class="a">Amount ₹</th><th></th></tr></thead>
            <tbody id="cartBody"></tbody>
          </table>
          <div class="empty" id="cartEmpty"><b>Bill is empty</b>Scan an item, type a name or code, or tap a quick button below.</div>
        </div>
        <div class="quick" id="quickItems"></div>
      </div>
      <aside class="bill-right">
        <div class="seg" id="modeSeg">
          <button data-act="mode" data-m="retail">Retail <small><kbd>F2</kbd></small></button>
          <button data-act="mode" data-m="wholesale">Wholesale <small><kbd>F2</kbd></small></button>
        </div>
        <div class="totalbox">
          <div class="lbl">Amount to pay</div>
          <div class="big" id="bigTotal"><sup>₹</sup>0</div>
          <div class="sub"><span id="cntInfo">0 items</span><span id="roundInfo"></span></div>
          <div class="save" id="saveInfo" hidden></div>
        </div>
        <div class="card">
          <div class="lines" id="sumLines"></div>
          <div class="row" style="margin-top:10px">
            <div class="field" style="flex:0 0 78px;margin:0"><label>Discount</label>
              <select id="discType"><option value="amt">₹</option><option value="pct">%</option></select></div>
            <div class="field" style="flex:1;margin:0"><label>&nbsp;<kbd>F7</kbd></label><input id="discVal" type="text" inputmode="decimal" placeholder="0"></div>
          </div>
        </div>
        <div class="card">
          <div class="field" style="margin-bottom:6px"><label>Customer name (optional) <kbd>F6</kbd></label><input id="custName" type="text" list="custList" autocomplete="off" placeholder="Walk-in customer"></div>
          <datalist id="custList"></datalist>
          <div class="field" style="margin:0"><label>Phone</label><input id="custPhone" type="text" inputmode="tel" autocomplete="off"></div>
        </div>
        <button class="btn primary xl" data-act="pay">Pay &amp; save bill <kbd>F9</kbd></button>
        <div class="row">
          <button class="btn" style="flex:1" data-act="hold">Hold &amp; new bill <kbd>F3</kbd></button>
          <button class="btn" data-act="clearbill">Clear</button>
        </div>
        <div class="help"><kbd>F1</kbd> item search · <kbd>F4</kbd> next bill · <kbd>F8</kbd> remove last · <kbd>Enter</kbd> on empty box = pay · <kbd>Esc</kbd> clear</div>
      </aside>
    </section>
    <section id="v-dash" class="view" hidden></section>
    <section id="v-stock" class="view" hidden></section>
    <section id="v-in" class="view" hidden></section>
    <section id="v-cust" class="view" hidden></section>
    <section id="v-sales" class="view" hidden></section>
    <section id="v-set" class="view" hidden></section>
  </div>
</div>
<div id="receipt"></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:n;};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const r3=n=>Math.round((n+Number.EPSILON)*1000)/1000;

async function exportFile(name,text,mime){
  if(dl){try{await dl.save({filename:name,data:text});return true;}catch(e){if(e&&e.code==='declined')return false;}}
  try{const b=new Blob([text],{type:mime||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);return true;}catch(e){}
  openModal('<div class="modal wide"><h2>Copy this text</h2><p><small>Downloads are not available here. Select all, copy, and paste into a file named '+esc(name)+'.</small></p><textarea rows="12" readonly>'+esc(text)+'</textarea><div class="row end"><button class="btn primary" data-act="mclose">Done</button></div></div>');
  return false;
}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCSV(rows){return '\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');}
function parseCSV(t){
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===','){r.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x!==''))rows.push(r);r=[];}
    else f+=c;}
  r.push(f);if(r.some(x=>x!==''))rows.push(r);return rows;
}

/* ---------- product search ---------- */
function search(q,limit=8){
  q=q.trim().toLowerCase();if(!q)return [];
  const terms=q.split(/\s+/),out=[];
  for(const p of db.products){
    const hay=(p.name+' '+(p.ta||'')+' '+p.code+' '+(p.barcode||'')+' '+p.cat).toLowerCase();
    if(terms.every(t=>hay.includes(t))){
      let s=0;const n=p.name.toLowerCase();
      if(String(p.code).toLowerCase()===q||p.barcode===q)s=100;
      else if(n.startsWith(q))s=50;
      else if(n.split(/\s+/).some(w=>w.startsWith(terms[0])))s=20;
      out.push([s,p]);
    }
  }
  out.sort((a,b)=>b[0]-a[0]||a[1].name.localeCompare(b[1].name));
  return out.slice(0,limit).map(x=>x[1]);
}
function exact(t){const tl=t.toLowerCase();return db.products.find(p=>p.barcode&&p.barcode===t)||db.products.find(p=>String(p.code).toLowerCase()===tl);}
function parseEntry(raw){
  let t=raw.trim(),qty=null;const m=t.match(/^(\d*\.?\d+)\s*[*xX]\s*(.+)$/);
  if(m){qty=parseFloat(m[1]);t=m[2].trim();}
  return {t,qty};
}

}

/* ---------- billing ---------- */
function totals(c){
  let sub=0,mrp=0,cost=0,qty=0;
  c.items.forEach(i=>{sub+=i.qty*i.rate;mrp+=i.qty*(i.mrp||i.rate);cost+=i.qty*(i.cost||0);qty+=i.qty;});
  let d=c.discType==='pct'?sub*num(c.discVal)/100:num(c.discVal);d=Math.max(0,Math.min(d,sub));
  const net=sub-d,total=Math.round(net);
  return {sub:r2(sub),disc:r2(d),round:r2(total-net),total,saved:Math.max(0,r2(mrp-total)),cost:r2(cost),count:c.items.length,qty:r3(qty)};
}
function renderBilling(){renderTabs();renderCart();renderQuick();renderSummary();syncRight();}
function renderTabs(){
  $('#billTabs').innerHTML=db.carts.map((c,i)=>{const t=totals(c);
    return '<button class="tab '+(i===db.active?'on':'')+'" data-act="tab" data-i="'+i+'"><b>Bill '+c.no+'</b><span>'+(c.items.length?c.items.length+' items · ₹'+t.total.toLocaleString('en-IN'):'empty')+'</span>'+(db.carts.length>1?'<i data-act="tabclose" data-i="'+i+'" title="Close this bill">×</i>':'')+'</button>';}).join('')
    +'<button class="tab add" data-act="newbill" title="New bill (F3)">+ New</button>';
}
function renderCart(){
  const c=cur(),body=$('#cartBody');
  body.innerHTML=c.items.map((it,i)=>{
    const p=prod(it.pid),low=p&&it.qty>p.stock;
    const step=isLoose(it)?'':'';
    return '<tr data-i="'+i+'" class="'+(i===ui.flash?'flash':'')+'"><td class="n">'+(i+1)+'</td>'
    +'<td class="nm"><b>'+esc(it.name)+'</b><small>'+esc(it.ta||'')+(it.ta?' · ':'')+'#'+esc(it.code)+(low?' · <span style="color:var(--bad);font-weight:700">only '+fq(p.stock)+' in stock</span>':'')+'</small></td>'
    +'<td class="q"><div class="stepper"><button data-act="qminus" tabindex="-1" aria-label="Less">−</button><input data-f="qty" value="'+fq(it.qty)+'" inputmode="decimal" aria-label="Quantity"><button data-act="qplus" tabindex="-1" aria-label="More">+</button></div> <small>'+esc(it.unit)+'</small></td>'
    +'<td><input data-f="rate" value="'+it.rate+'" inputmode="decimal" aria-label="Rate" class="'+(it.edited?'edited':'')+'"></td>'
    +'<td class="a">'+m2(it.qty*it.rate)+'</td><td><button class="x" data-act="del" tabindex="-1" aria-label="Remove item">×</button></td></tr>'+step;
  }).join('');
  $('#cartEmpty').hidden=c.items.length>0;
  const w=$('#cartWrap');w.scrollTop=w.scrollHeight;
}
function renderQuick(){
  const list=db.products.filter(p=>p.pin).slice(0,24);
  $('#quickItems').innerHTML=list.length?list.map(p=>'<button class="qb" data-act="quick" data-id="'+p.id+'"><b>'+esc(p.name.replace(/ \(Loose\)/,''))+'</b><small>#'+esc(p.code)+(isLoose(p)?' · per '+p.unit:'')+'</small></button>').join(''):'<small>Tip: in Stock → Edit item, tick “Show in quick buttons” for items you sell all day.</small>';
}
function renderSummary(){
  const c=cur(),t=totals(c);
  $('#bigTotal').innerHTML='<sup>₹</sup>'+t.total.toLocaleString('en-IN');
  $('#cntInfo').textContent=t.count+' item'+(t.count===1?'':'s')+' · qty '+fq(t.qty);
  $('#roundInfo').textContent=t.round?'round off '+(t.round>0?'+':'')+m2(t.round):'';
  const s=$('#saveInfo');s.hidden=!(t.saved>0&&c.mode==='retail');s.textContent='Customer saves ₹'+m2(t.saved)+' vs MRP';
  $('#sumLines').innerHTML='<div><span>Sub total</span><b>'+rs(t.sub)+'</b></div>'+(t.disc?'<div><span>Discount</span><b>− '+rs(t.disc)+'</b></div>':'');
  $$('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===c.mode));
}
function syncRight(){
  const c=cur();$('#discType').value=c.discType;$('#discVal').value=c.discVal;$('#custName').value=c.custName;$('#custPhone').value=c.custPhone;
  $('#custList').innerHTML=db.customers.map(x=>'<option value="'+esc(x.name)+'"></option>').join('');
}
function addToCart(p,qty){
  const c=cur();const q=qty||1;let idx=c.items.findIndex(i=>i.pid===p.id);
  if(idx>=0)c.items[idx].qty=r3(c.items[idx].qty+q);
  else{c.items.push({pid:p.id,name:p.name,ta:p.ta,code:p.code,unit:p.unit,qty:q,rate:priceFor(p,c.mode),mrp:p.mrp,cost:p.cost});idx=c.items.length-1;}
  ui.flash=idx;setTimeout(()=>{ui.flash=-1;const r=$('#cartBody tr.flash');if(r)r.classList.remove('flash');},700);
  if(c.items[idx].qty>p.stock)toast('Only '+fq(p.stock)+' '+p.unit+' of '+esc(p.name)+' in stock','warn');
  renderCart();renderSummary();renderTabs();save();beep(true);
  if(isLoose(p)&&!qty){const inp=$('#cartBody tr[data-i="'+idx+'"] input[data-f="qty"]');if(inp){inp.focus();inp.select();return;}}
  $('#entry').focus();
}
function handleEntry(){
  const en=$('#entry'),raw=en.value;
  if(!raw.trim()){if(cur().items.length)openPay();return;}
  const {t,qty}=parseEntry(raw);
  let p=exact(t);
  if(!p){const res=search(t);if(res.length)p=res[Math.min(ui.sel,res.length-1)];}
  if(!p){beep(false);toast('No item found for “'+esc(t)+'”','err');en.select();return;}
  en.value='';hideSuggest();addToCart(p,qty);
}
function hideSuggest(){ui.sugg=[];ui.sel=0;const s=$('#suggest');s.hidden=true;s.innerHTML='';}
function updateSuggest(){
  const {t}=parseEntry($('#entry').value);const s=$('#suggest');
  ui.sugg=t.length?search(t):[];ui.sel=0;
  if(!ui.sugg.length){s.hidden=true;return;}
  s.hidden=false;s.innerHTML=suggestHTML(ui.sugg,ui.sel,'sug');
}
function setMode(m){
  const c=cur();c.mode=m;
  c.items.forEach(i=>{const p=prod(i.pid);if(p&&!i.edited)i.rate=priceFor(p,m);});
  renderCart();renderSummary();renderTabs();save();toast('Switched to '+(m==='retail'?'Retail':'Wholesale')+' rates','ok',1400);refocus();
}
function holdNew(){
  if(!cur().items.length){toast('This bill is empty – nothing to hold','warn');return;}
  db.carts.push(newCart());db.active=db.carts.length-1;renderBilling();save();toast('Bill held. Resume it from the tabs above (F4 = next bill)','ok');refocus();
}
function nextBill(){db.active=(db.active+1)%db.carts.length;renderBilling();save();refocus();}
function removeLast(){const c=cur();if(!c.items.length)return;c.items.pop();renderCart();renderSummary();renderTabs();save();}
function closeBill(i){
  const go=()=>{db.carts.splice(i,1);if(!db.carts.length)db.carts.push(newCart());db.active=Math.min(db.active>i?db.active-1:db.active,db.carts.length-1);renderBilling();save();};
  if(db.carts[i].items.length)askConfirm('Discard Bill '+db.carts[i].no+' with '+db.carts[i].items.length+' items?','Discard',go,true);else go();
}
function clearBill(){
  const c=cur();if(!c.items.length)return;
  askConfirm('Clear all items from this bill?','Clear bill',()=>{c.items=[];c.discVal='';c.custName='';c.custPhone='';renderBilling();save();},true);
}
function custAuto(){
  const c=cur(),n=c.custName.trim().toLowerCase();if(!n)return;
  const x=db.customers.find(k=>k.name.toLowerCase()===n);
  if(x){if(x.phone&&!c.custPhone){c.custPhone=x.phone;$('#custPhone').value=x.phone;}
    if(x.type==='wholesale'&&c.mode!=='wholesale')setMode('wholesale');
    if(x.due>0)toast(esc(x.name)+' has an old balance of '+rs(x.due),'warn',3500);}
}

/* ---------- payment ---------- */
function openPay(){
  const c=cur();if(!c.items.length){toast('Add items before taking payment','warn');return;}
  const t=totals(c);ui.pay={mode:'cash'};
  openModal('<div class="modal"><h2>Take payment · Bill '+c.no+' <small>('+(c.mode==='retail'?'Retail':'Wholesale')+')</small></h2>'
  +'<div class="paytotal">'+rs(t.total)+'</div>'
  +'<div class="paymodes" id="payModes"><button data-act="pm" data-m="cash">Cash<small><kbd>F1</kbd></small></button><button data-act="pm" data-m="upi">UPI<small><kbd>F2</kbd></small></button><button data-act="pm" data-m="card">Card<small><kbd>F3</kbd></small></button><button data-act="pm" data-m="credit">Credit<small><kbd>F4</kbd></small></button></div>'
  +'<div class="field"><label id="recvLbl">Cash received</label><input id="payRecv" type="text" inputmode="decimal" placeholder="Leave empty if exact amount"></div>'
  +'<div class="chips" id="payChips"></div><div class="changebox" id="payChange"></div>'
  +'<div id="credBox" style="margin-top:10px" hidden><div class="formgrid"><div class="field"><label>Customer name *</label><input id="payName" type="text" list="custList" value="'+esc(c.custName)+'"></div><div class="field"><label>Phone</label><input id="payPhone" type="text" inputmode="tel" value="'+esc(c.custPhone)+'"></div></div></div>'
  +'<div class="row end"><button class="btn" data-act="mclose">Back <kbd>Esc</kbd></button><button class="btn dark" data-act="paysave" data-p="0">Save only</button><button class="btn primary" data-act="paysave" data-p="1">Save &amp; print <kbd>Enter</kbd></button></div></div>',
  e=>{
    if(e.key==='F1'||e.key==='F2'||e.key==='F3'||e.key==='F4'){e.preventDefault();setPayMode(['cash','upi','card','credit'][+e.key[1]-1]);}
    else if(e.key==='Enter'){e.preventDefault();saveBill(db.settings.autoPrint?true:true);}
  });
  setPayMode('cash');
  $('#payRecv').addEventListener('input',payCalc);
  $('#payName').addEventListener('input',()=>{});
}
function setPayMode(m){
  ui.pay.mode=m;const t=totals(cur());
  $$('#payModes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  const r=$('#payRecv');r.disabled=(m==='upi'||m==='card');r.value='';
  $('#recvLbl').textContent=m==='credit'?'Advance paid now (optional)':m==='cash'?'Cash received':'Paid in full by '+m.toUpperCase();
  const ch=[t.total,Math.ceil(t.total/10)*10,Math.ceil(t.total/50)*50,Math.ceil(t.total/100)*100,200,500,2000].filter((v,i,a)=>v>=t.total&&a.indexOf(v)===i).slice(0,5);
  $('#payChips').innerHTML=m==='cash'?ch.map(v=>'<button class="chip" data-act="chip" data-v="'+v+'">'+(v===t.total?'Exact ':'')+'₹'+v+'</button>').join(''):'';
  $('#credBox').hidden=!(m==='credit');
  payCalc();if(!r.disabled)r.focus();
}
function payNumbers(){
  const t=totals(cur()),m=ui.pay.mode,raw=$('#payRecv').value.trim();
  let paid,change=0,recv;
  if(m==='cash'){recv=raw===''?t.total:num(raw);paid=Math.min(recv,t.total);change=Math.max(0,r2(recv-t.total));}
  else if(m==='credit'){recv=num(raw);paid=Math.min(recv,t.total);}
  else{paid=t.total;recv=t.total;}
  return {t,paid:r2(paid),due:r2(t.total-paid),change,recv:r2(recv)};
}
function payCalc(){
  const n=payNumbers(),b=$('#payChange');
  if(n.due>0){b.className='changebox due';b.textContent='Balance on credit: '+rs(n.due);$('#credBox').hidden=false;}
  else if(ui.pay.mode==='cash'){b.className='changebox';b.textContent='Return change: '+rs(n.change);$('#credBox').hidden=true;}
  else{b.className='changebox';b.textContent='Paid in full';$('#credBox').hidden=true;}
}
function saveBill(print){
  const c=cur(),n=payNumbers();
  const name=($('#payName')?$('#payName').value:c.custName).trim(),phone=($('#payPhone')?$('#payPhone').value:c.custPhone).trim();
  if(n.due>0&&!name){toast('Enter the customer name to keep ₹'+m2(n.due)+' on credit','err');$('#credBox').hidden=false;$('#payName').focus();return;}
  let cust=null;
  const custName=name||c.custName.trim();
  if(custName){
    cust=db.customers.find(k=>k.name.toLowerCase()===custName.toLowerCase());
    if(!cust){cust={id:newId('c'),name:custName,phone:phone||c.custPhone,type:c.mode,due:0,ledger:[]};db.customers.push(cust);}
    else if(phone&&!cust.phone)cust.phone=phone;
  }
  const b={no:db.settings.nextBill++,ts:Date.now(),mode:c.mode,status:'ok',
    items:c.items.map(i=>({pid:i.pid,name:i.name,ta:i.ta,unit:i.unit,qty:i.qty,rate:i.rate,mrp:i.mrp,cost:i.cost})),
    sub:n.t.sub,disc:n.t.disc,round:n.t.round,total:n.t.total,saved:n.t.saved,cost:n.t.cost,
    pay:{mode:ui.pay.mode,paid:n.paid,due:n.due,recv:n.recv,change:n.change},cust:cust?{id:cust.id,name:cust.name,phone:cust.phone}:null};
  db.bills.push(b);
  b.items.forEach(i=>{const p=prod(i.pid);if(p)p.stock=r3(p.stock-i.qty);});
  if(cust&&n.due>0){cust.due=r2(cust.due+n.due);cust.ledger.push({ts:b.ts,type:'bill',ref:b.no,amt:n.due});}
  db.carts.splice(db.active,1);if(!db.carts.length)db.carts.push(newCart());db.active=Math.min(db.active,db.carts.length-1);
  save();closeModal();renderBilling();
  toast('Bill '+billNo(b.no)+' saved'+(b.pay.mode==='cash'&&n.change>0?' · <b>Return '+rs(n.change)+'</b>':''),'ok',5000);
  if(print&&db.settings.autoPrint!==false)printReceipt(b);else if(print)printReceipt(b);
}

/* ---------- receipt / print ---------- */
function applyPaper(){
  const w=db.settings.paper==='58'?58:80;
  $('#pageStyle').textContent='@page{size:'+w+'mm auto;margin:0}';
}
function receiptHTML(b,preview){
  const s=db.settings,w58=s.paper==='58';
  const modeLbl={cash:'Cash',upi:'UPI',card:'Card',credit:'Credit'}[b.pay.mode];
  const items=b.items.map(i=>'<div class="it"><div class="nm">'+esc(i.name)+(s.printTa&&i.ta?'<br>'+esc(i.ta):'')+'</div><div class="ln"><span>'+fq(i.qty)+' '+esc(i.unit)+' × '+m2(i.rate)+'</span><span>'+m2(i.qty*i.rate)+'</span></div></div>').join('');
  return '<div class="rc '+(w58?'w58':'')+'"><div class="c"><h4>'+esc(s.shop)+'</h4>'+(s.address?'<div>'+esc(s.address)+'</div>':'')+(s.phone?'<div>Ph: '+esc(s.phone)+'</div>':'')+'</div><hr>'
   +'<div class="tt"><span>Bill: '+billNo(b.no)+'</span><span>'+(b.mode==='wholesale'?'WHOLESALE':'RETAIL')+'</span></div>'
   +'<div class="tt"><span>'+fdate(b.ts)+'</span><span>'+ftime(b.ts)+'</span></div>'
   +(b.cust?'<div>Customer: '+esc(b.cust.name)+(b.cust.phone?' ('+esc(b.cust.phone)+')':'')+'</div>':'')
   +'<hr>'+items+'<hr>'
   +'<div class="tt"><span>Sub total</span><span>'+m2(b.sub)+'</span></div>'
   +(b.disc?'<div class="tt"><span>Discount</span><span>- '+m2(b.disc)+'</span></div>':'')
   +(b.round?'<div class="tt"><span>Round off</span><span>'+(b.round>0?'+':'')+m2(b.round)+'</span></div>':'')
   +'<div class="tt big"><span>TOTAL</span><span>₹ '+m2(b.total)+'</span></div><hr>'
   +'<div class="tt"><span>Paid by '+modeLbl+'</span><span>'+m2(b.pay.paid)+'</span></div>'
   +(b.pay.change>0?'<div class="tt"><span>Change returned</span><span>'+m2(b.pay.change)+'</span></div>':'')
   +(b.pay.due>0?'<div class="tt"><b>Balance (credit)</b><b>'+m2(b.pay.due)+'</b></div>':'')
   +'<div>'+b.items.length+' item'+(b.items.length===1?'':'s')+', qty '+fq(b.items.reduce((a,i)=>a+i.qty,0))+'</div>'
   +(b.saved>0&&b.mode==='retail'?'<div class="c" style="margin-top:3px">You saved ₹'+m2(b.saved)+' on MRP!</div>':'')
   +'<hr><div class="c">'+esc(s.footer)+'</div></div>';
}
function printReceipt(b){
  applyPaper();$('#receipt').innerHTML=receiptHTML(b);
  setTimeout(()=>{try{window.print();}catch(e){toast('Printing is blocked in this view. Open the app in a normal browser tab to print.','err',5000);}},120);
}
function viewBill(no){
  const b=db.bills.find(x=>x.no===no);if(!b)return;
  openModal('<div class="modal"><h2>Bill '+billNo(b.no)+(b.status==='cancelled'?' <span class="tag bad">Cancelled</span>':'')+'</h2><div class="rcprev">'+receiptHTML(b)+'</div>'
   +'<div class="row end"><button class="btn" data-act="mclose">Close</button><button class="btn" data-act="billfile" data-no="'+b.no+'">Save as file</button><button class="btn primary" data-act="reprint" data-no="'+b.no+'">Print again</button></div></div>');
}

/* ---------- stock page ---------- */
function stockStatus(p){
  const out=[];
  if(p.stock<=0)out.push('<span class="tag bad">Out of stock</span>');
  else if(p.stock<=p.min)out.push('<span class="tag warn">Low</span>');
  else out.push('<span class="tag ok">OK</span>');
  if(p.expiry){const d=Math.ceil((new Date(p.expiry+'T00:00:00')-startOfDay(Date.now()))/DAY);
    if(d<0)out.push('<span class="tag bad">Expired</span>');else if(d<=30)out.push('<span class="tag warn">Exp '+d+'d</span>');}
  return out.join(' ');
}
function filteredProducts(){
  const q=ui.stockQ.trim().toLowerCase();
  return db.products.filter(p=>{
    if(ui.stockCat&&p.cat!==ui.stockCat)return false;
    if(ui.stockF==='low'&&!(p.stock<=p.min&&p.stock>0))return false;
    if(ui.stockF==='out'&&p.stock>0)return false;
    if(ui.stockF==='exp'){if(!p.expiry)return false;if((new Date(p.expiry+'T00:00:00')-startOfDay(Date.now()))/DAY>30)return false;}
    if(q&&!(p.name+' '+(p.ta||'')+' '+p.code+' '+(p.barcode||'')).toLowerCase().includes(q))return false;
    return true;
  });
}
function stockRow(p){
  return '<tr data-id="'+p.id+'"><td>'+esc(p.code)+'</td><td><b>'+esc(p.name)+'</b><small>'+esc(p.ta||'')+(p.barcode?' · '+esc(p.barcode):'')+'</small></td><td><small>'+esc(p.cat)+'</small></td><td>'+esc(p.unit)+'</td>'
  +['cost','retail','wholesale','stock','min'].map(f=>'<td class="num"><input class="cell '+(f==='retail'&&p.retail<p.cost?'bad':'')+'" data-f="'+f+'" value="'+p[f]+'" inputmode="decimal" aria-label="'+f+' of '+esc(p.name)+'"></td>').join('')
  +'<td data-st>'+stockStatus(p)+'</td><td><button class="btn sm" data-act="editp" data-id="'+p.id+'">Edit</button></td></tr>';
}
function renderStockRows(){
  const list=filteredProducts(),show=list.slice(0,250);
  $('#stockBody').innerHTML=show.map(stockRow).join('')||'<tr><td colspan="11"><div class="empty"><b>No items match</b>Change the search or filter, or add a new item.</div></td></tr>';
  $('#stockInfo').textContent=list.length+' item'+(list.length===1?'':'s')+(list.length>250?' (showing first 250 – search to narrow)':'');
}
function renderStock(){
  const P=db.products,val=P.reduce((a,p)=>a+Math.max(0,p.stock)*p.cost,0);
  const low=P.filter(p=>p.stock>0&&p.stock<=p.min).length,out=P.filter(p=>p.stock<=0).length;
  $('#v-stock').innerHTML='<div class="pagehead"><div><h1>Stock</h1><small id="stockInfo"></small></div><div class="sp"></div>'
  +'<button class="btn" data-act="bulkprice">Change prices in bulk</button><button class="btn" data-act="impcsv">Import CSV</button><button class="btn" data-act="expcsv">Export CSV</button><button class="btn primary" data-act="addp">+ Add item</button></div>'
  +'<div class="stats"><div class="stat"><small>Items</small><b>'+P.length+'</b></div><div class="stat a"><small>Stock value (at cost)</small><b>'+rs(val)+'</b></div><div class="stat '+(low?'a':'g')+'"><small>Low stock</small><b>'+low+'</b></div><div class="stat '+(out?'r':'g')+'"><small>Out of stock</small><b>'+out+'</b></div></div>'
  +'<div class="toolbar"><input type="search" id="stockQ" placeholder="Search name, Tamil name, code or barcode" value="'+esc(ui.stockQ)+'">'
  +'<select id="stockCat"><option value="">All categories</option>'+catList().map(c=>'<option '+(c===ui.stockCat?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select>'
  +'<select id="stockF"><option value="">All stock</option><option value="low" '+(ui.stockF==='low'?'selected':'')+'>Low stock</option><option value="out" '+(ui.stockF==='out'?'selected':'')+'>Out of stock</option><option value="exp" '+(ui.stockF==='exp'?'selected':'')+'>Expiring ≤ 30 days</option></select>'
  +'<small>Edit prices and stock directly in the table. In Stock, type <b>+10</b> to add 10 or <b>-2</b> to remove 2.</small><input type="file" id="csvFile" accept=".csv,text/csv" hidden></div>'
  +'<div class="tablewrap"><table class="g"><thead><tr><th>Code</th><th>Item</th><th>Category</th><th>Unit</th><th class="num">Cost ₹</th><th class="num">Retail ₹</th><th class="num">Wholesale ₹</th><th class="num">Stock</th><th class="num">Min</th><th>Status</th><th></th></tr></thead><tbody id="stockBody"></tbody></table></div>';
  renderStockRows();
}
function catList(){const s=new Set(CATS);db.products.forEach(p=>p.cat&&s.add(p.cat));return Array.from(s);}
function nextCode(){let m=0;db.products.forEach(p=>{const n=parseInt(p.code,10);if(!isNaN(n)&&n>m&&n<100000)m=n;});return String(m+1);}
function openProduct(id){
  const p=id?prod(id):{name:'',ta:'',cat:CATS[0],unit:'pcs',code:nextCode(),barcode:'',mrp:'',retail:'',wholesale:'',cost:'',stock:0,min:10,expiry:'',pin:false};
  const f=(l,i,v,a='',cls='')=>'<div class="field '+cls+'"><label for="f_'+i+'">'+l+'</label><input id="f_'+i+'" value="'+esc(v)+'" '+a+'></div>';

function saveProduct(){
  const form=$('#pform'),id=form.dataset.id,g=i=>$('#f_'+i).value.trim();
  const name=g('name');if(!name){toast('Item name is required','err');$('#f_name').focus();return;}
  if(!(num(g('retail'))>0)){toast('Enter the retail price','err');$('#f_retail').focus();return;}
  const code=g('code')||nextCode(),barcode=g('barcode');
  const dupC=db.products.find(p=>p.id!==id&&String(p.code).toLowerCase()===code.toLowerCase());
  if(dupC){toast('Quick code '+esc(code)+' is already used by '+esc(dupC.name),'err',3500);$('#f_code').focus();return;}
  const dupB=barcode&&db.products.find(p=>p.id!==id&&p.barcode===barcode);
  if(dupB){toast('This barcode already belongs to '+esc(dupB.name),'err',3500);$('#f_barcode').focus();return;}
  const retail=num(g('retail'));
  const rec={name,ta:g('ta'),cat:g('cat')||'General',unit:$('#f_unit').value,code,barcode,mrp:num(g('mrp'))||retail,cost:num(g('cost')),retail,wholesale:num(g('wholesale'))||retail,stock:num(g('stock')),min:num(g('min')),expiry:g('expiry'),pin:$('#f_pin').checked};
  if(id)Object.assign(prod(id),rec);else db.products.push(Object.assign({id:newId('p')},rec));
  save();closeModal();toast('Item saved','ok');renderStockRows();if(ui.view==='stock')renderStock();
}

function applyBulk(){
  const cat=$('#b_cat').value,which=$('#b_which').value,v=num($('#b_val').value),type=$('#b_type').value,rnd=$('#b_round').checked;
  if(!v){toast('Enter how much to change','err');return;}

  db.products.forEach(p=>{if(cat&&p.cat!==cat)return;n++;fields.forEach(f=>{let x=type==='pct'?p[f]*(1+v/100):p[f]+v;x=Math.max(0,x);if(rnd)x=Math.round(x*2)/2;p[f]=r2(x);});});

function exportProductsCSV(){
  const rows=[['name','tamil','category','unit','code','barcode','mrp','retail','wholesale','cost','stock','min','expiry']];
  db.products.forEach(p=>rows.push([p.name,p.ta,p.cat,p.unit,p.code,p.barcode,p.mrp,p.retail,p.wholesale,p.cost,p.stock,p.min,p.expiry]));

function importCSV(text){
  const rows=parseCSV(text.replace(/^\ufeff/,''));if(rows.length<2){toast('The file has no data rows','err');return;}
  const h=rows[0].map(x=>x.trim().toLowerCase());const ix=k=>h.indexOf(k);
  if(ix('name')<0||ix('retail')<0){toast('CSV needs at least “name” and “retail” columns. Use Export CSV to get the template.','err',5000);return;}
  let add=0,upd=0;
  rows.slice(1).forEach(r=>{
    const v=k=>ix(k)>=0?(r[ix(k)]||'').trim():'';
    const name=v('name');if(!name)return;
    let p=(v('barcode')&&db.products.find(x=>x.barcode===v('barcode')))||(v('code')&&db.products.find(x=>String(x.code)===v('code')))||db.products.find(x=>x.name.toLowerCase()===name.toLowerCase());
    const retail=num(v('retail'));
    const rec={name,ta:v('tamil'),cat:v('category')||'General',unit:UNITS.includes(v('unit'))?v('unit'):'pcs',barcode:v('barcode'),mrp:num(v('mrp'))||retail,retail,wholesale:num(v('wholesale'))||retail,cost:num(v('cost')),stock:num(v('stock')),min:ix('min')>=0?num(v('min')):10,expiry:v('expiry')};
    if(p){Object.assign(p,rec);if(v('code'))p.code=v('code');upd++;}
    else{db.products.push(Object.assign({id:newId('p'),code:v('code')||nextCode(),pin:false},rec));add++;}
  });
  save();toast('Import done: '+add+' added, '+upd+' updated','ok',4000);renderStock();
}

/* ---------- sales / reports ---------- */
function rangeBounds(){
  const t0=startOfDay(Date.now());
  switch(ui.range){
    case 'yesterday':return [t0-DAY,t0];
    case '7d':return [t0-6*DAY,t0+DAY];
    case 'month':{const d=new Date();d.setDate(1);d.setHours(0,0,0,0);return [d.getTime(),t0+DAY];}
    case 'custom':{const f=ui.from?new Date(ui.from+'T00:00:00').getTime():t0,t=ui.to?new Date(ui.to+'T00:00:00').getTime()+DAY:t0+DAY;return [f,t];}
    default:return [t0,t0+DAY];
  }
}
const billsIn=(a,b,all)=>db.bills.filter(x=>x.ts>=a&&x.ts<b&&(all||x.status!=='cancelled'));
function sumBills(L){
  const r={n:L.length,sales:0,disc:0,profit:0,cash:0,upi:0,card:0,credit:0,retail:0,wholesale:0};
  L.forEach(b=>{r.sales+=b.total;r.disc+=b.disc;r.profit+=b.total-b.cost;r[b.mode]+=b.total;
    if(b.pay.mode==='cash')r.cash+=b.pay.paid;else if(b.pay.mode==='upi')r.upi+=b.pay.paid;else if(b.pay.mode==='card')r.card+=b.pay.paid;else r.cash+=b.pay.paid;r.credit+=b.pay.due;});
  return r;
}
function topItems(L,n){
  const m={};L.forEach(b=>b.items.forEach(i=>{const k=i.name;m[k]=m[k]||{name:k,unit:i.unit,qty:0,amt:0};m[k].qty+=i.qty;m[k].amt+=i.qty*i.rate;}));
  return Object.values(m).sort((a,b)=>b.amt-a.amt).slice(0,n);
}

function cancelBill(no){
  const b=db.bills.find(x=>x.no===no);if(!b||b.status==='cancelled')return;

    b.status='cancelled';b.items.forEach(i=>{const p=prod(i.pid);if(p)p.stock=r3(p.stock+i.qty);});
    if(b.cust&&b.pay.due>0){const c=db.customers.find(x=>x.id===b.cust.id);if(c){c.due=Math.max(0,r2(c.due-b.pay.due));c.ledger.push({ts:Date.now(),type:'payment',amt:b.pay.due});}}

/* ---------- dashboard ---------- */
function renderDash(){
  const t0=startOfDay(Date.now()),today=billsIn(t0,t0+DAY),s=sumBills(today);
  const P=db.products,val=P.reduce((a,p)=>a+Math.max(0,p.stock)*p.cost,0),due=db.customers.reduce((a,c)=>a+c.due,0);
  const low=P.filter(p=>p.stock<=p.min).sort((x,y)=>(x.stock/(x.min||1))-(y.stock/(y.min||1)));
  const exp=P.filter(p=>p.expiry).map(p=>({p,d:Math.ceil((new Date(p.expiry+'T00:00:00')-t0)/DAY)})).filter(x=>x.d<=30).sort((a,b)=>a.d-b.d);
  const days=[];for(let i=6;i>=0;i--){const a=t0-i*DAY;days.push({l:new Date(a).toLocaleDateString('en-IN',{weekday:'short'}),v:sumBills(billsIn(a,a+DAY)).sales});}
  const mx=Math.max(1,...days.map(d=>d.v));
  const svg='<svg class="bars" viewBox="0 0 420 150" role="img" aria-label="Sales for the last 7 days">'+days.map((d,i)=>{const h=Math.round(d.v/mx*92);return '<rect x="'+(i*60+10)+'" y="'+(110-h)+'" width="40" height="'+h+'" rx="5" style="fill:'+(i===6?'var(--accent)':'var(--line)')+'"/><text x="'+(i*60+30)+'" y="128" text-anchor="middle" style="fill:var(--muted);font-size:12px">'+d.l+'</text><text x="'+(i*60+30)+'" y="'+(104-h)+'" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:600">'+(d.v?'₹'+Math.round(d.v).toLocaleString('en-IN'):'')+'</text>';}).join('')+'</svg>';
  const daysSince=db.settings.lastBackup?Math.floor((Date.now()-db.settings.lastBackup)/DAY):null;
  $('#v-dash').innerHTML='<div class="pagehead"><div><h1>Dashboard</h1><small>'+new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</small></div></div>'
  +((daysSince===null||daysSince>=7)&&(db.bills.length||0)>0?'<div class="banner"><span>'+(daysSince===null?'You have never downloaded a backup.':'Last backup was '+daysSince+' days ago.')+' Your data lives in this browser – keep a copy safe.</span><span class="sp"></span><button class="btn sm" data-act="backup">Download backup</button></div>':'')
  +'<div class="stats"><div class="stat a"><small>Today’s sales</small><b>'+rs(s.sales)+'</b></div><div class="stat"><small>Bills today</small><b>'+s.n+'</b></div><div class="stat g"><small>Estimated profit today</small><b>'+rs(s.profit)+'</b></div><div class="stat"><small>Stock value (cost)</small><b>'+rs(val)+'</b></div><div class="stat '+(due?'r':'g')+'"><small>Credit to collect</small><b>'+rs(due)+'</b></div></div>'
  +'<div class="grid2"><div class="card"><h3>Last 7 days</h3>'+svg+'</div>'
  +'<div class="card"><h3>Best sellers today</h3>'+(topItems(today,6).map(t=>'<div class="listrow"><span>'+esc(t.name)+' <small>'+fq(t.qty)+' '+esc(t.unit)+'</small></span><b>'+rs(t.amt)+'</b></div>').join('')||'<small>No sales yet today.</small>')+'</div>'
  +'<div class="card"><div class="row"><h3 style="flex:1;margin:0">Need to reorder ('+low.length+')</h3>'+(low.length?'<button class="btn sm" data-act="reorder">Download list</button>':'')+'</div>'
  +(low.slice(0,10).map(p=>'<div class="listrow"><div><b>'+esc(p.name)+'</b><small>'+esc(p.cat)+'</small></div><div style="text-align:right">'+(p.stock<=0?'<span class="tag bad">Out</span>':'<span class="tag warn">'+fq(p.stock)+' '+esc(p.unit)+'</span>')+'<small>alert at '+fq(p.min)+'</small></div></div>').join('')||'<small>Everything is above its alert level.</small>')+(low.length>10?'<small>+ '+(low.length-10)+' more – see Stock → Low stock</small>':'')+'</div>'
  +'<div class="card"><h3>Expiring in 30 days ('+exp.length+')</h3>'+(exp.slice(0,10).map(x=>'<div class="listrow"><div><b>'+esc(x.p.name)+'</b><small>'+fq(x.p.stock)+' '+esc(x.p.unit)+' in stock · '+fdate(new Date(x.p.expiry+'T00:00:00').getTime())+'</small></div><span class="tag '+(x.d<0?'bad':'warn')+'">'+(x.d<0?'Expired':x.d+' days')+'</span></div>').join('')||'<small>Nothing expiring soon.</small>')+'</div></div>';
}
function downloadReorder(){
  const low=db.products.filter(p=>p.stock<=p.min);
  const lines=['REORDER LIST – '+db.settings.shop+' – '+fdate(Date.now()),''].concat(low.map(p=>p.name+' ('+p.ta+')  | in stock: '+fq(p.stock)+' '+p.unit+'  | suggested order: '+fq(Math.max(p.min*2-p.stock,1))+' '+p.unit));
  exportFile('SKS-reorder-'+ymd(new Date())+'.txt',lines.join('\r\n'),'text/plain');
}

  paysave:el=>saveBill(el.dataset.p==='1'),
  quick:el=>addToCart(prod(el.dataset.id),null),

  billfile:el=>{const b=db.bills.find(x=>x.no===+el.dataset.no);exportFile(billNo(b.no)+'.html','<!DOCTYPE html><meta charset="utf-8"><title>'+billNo(b.no)+'</title><body style="margin:0">'+receiptHTML(b).replace('class="rc','style="font-family:Arial,sans-serif;font-size:12px;width:'+(db.settings.paper==='58'?'48':'72')+'mm;margin:0 auto" class="rc')+'<style>.rc .tt,.rc .it .ln{display:flex;justify-content:space-between}.rc hr{border:0;border-top:1px dashed #000}.rc .c{text-align:center}@page{size:'+db.settings.paper+'mm auto;margin:0}</style></body>','text/html');},
  addp:()=>openProduct(null),editp:el=>openProduct(el.dataset.id),savep:()=>saveProduct(),
  delp:el=>{const p=prod(el.dataset.id);askConfirm('Delete “'+p.name+'”?','Delete',()=>{db.products=db.products.filter(x=>x.id!==p.id);save();closeModal();renderStock();toast('Item deleted','ok');},true);},
  bulkprice:()=>openBulk(),bulkgo:()=>applyBulk(),
  expcsv:()=>exportProductsCSV(),impcsv:()=>$('#csvFile').click(),
  indel:el=>{ui.pin.lines.splice(+el.closest('tr').dataset.i,1);renderInLines();},
  inclear:()=>{ui.pin={supplier:'',invoice:'',lines:[],sel:0,sugg:[]};renderIn();},

};
document.addEventListener('click',e=>{
  if(e.target.id==='bd'){closeModal();return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e);}
});

/* ---------- input events ---------- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='entry')updateSuggest();
  else if(t.id==='discVal'){cur().discVal=t.value;renderSummary();renderTabs();save();}
  else if(t.id==='custName'){cur().custName=t.value;save();custAuto();}
  else if(t.id==='custPhone'){cur().custPhone=t.value;save();}
  else if(t.id==='stockQ'){ui.stockQ=t.value;renderStockRows();}
  else if(t.id==='custQ'){ui.custQ=t.value;const pos=t.selectionStart;renderCust();const n=$('#custQ');n.focus();n.setSelectionRange(pos,pos);}
  else if(t.id==='inEntry'){
    const {t:q}=parseEntry(t.value);ui.pin.sugg=q?search(q,6):[];ui.pin.sel=0;const s=$('#inSug');
    s.hidden=!ui.pin.sugg.length;s.innerHTML=suggestHTML(ui.pin.sugg,0,'insug');
  }
  else if(t.id==='inSup')ui.pin.supplier=t.value;else if(t.id==='inInv')ui.pin.invoice=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='discType'){cur().discType=t.value;renderSummary();renderTabs();save();}
  else if(t.id==='stockCat'){ui.stockCat=t.value;renderStockRows();}
  else if(t.id==='stockF'){ui.stockF=t.value;renderStockRows();}
  else if(t.id==='rFrom'){ui.from=t.value;renderSales();}
  else if(t.id==='rTo'){ui.to=t.value;renderSales();}
  else if(t.id==='csvFile'&&t.files[0]){const r=new FileReader();r.onload=()=>importCSV(String(r.result));r.readAsText(t.files[0]);t.value='';}
  else if(t.id==='restoreFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(String(r.result));if(!d.products||!d.settings)throw 0;askConfirm('Replace everything in this app with the backup file?','Restore',()=>{db=d;migrate();save();applyPaper();brand();toast('Backup restored','ok');go('billing');},true);}catch(x){toast('That file is not a valid SKS backup','err');}};r.readAsText(t.files[0]);t.value='';}
  else if(t.dataset&&t.dataset.s){const k=t.dataset.s;db.settings[k]=t.type==='checkbox'?t.checked:t.value;save();if(k==='paper')applyPaper();brand();}
  else if(t.closest&&t.closest('#cartBody')&&t.dataset.f){
    const i=+t.closest('tr').dataset.i,it=cur().items[i];if(!it)return;
    if(t.dataset.f==='qty'){const q=num(t.value);if(q<=0)cur().items.splice(i,1);else it.qty=r3(q);}
    else{const r=num(t.value),p=prod(it.pid);it.rate=r;it.edited=!p||r!==priceFor(p,cur().mode);}
    renderCart();renderSummary();renderTabs();save();
  }
  else if(t.closest&&t.closest('#stockBody')&&t.dataset.f){
    const row=t.closest('tr'),p=prod(row.dataset.id),f=t.dataset.f;
    if(f==='stock'&&/^\s*[+-]/.test(t.value))p.stock=r3(p.stock+num(t.value));else p[f]=num(t.value);
    t.value=p[f];save();row.querySelector('[data-st]').innerHTML=stockStatus(p);
    const rt=row.querySelector('[data-f="retail"]');if(rt)rt.classList.toggle('bad',p.retail<p.cost);
  }
  else if(t.closest&&t.closest('#inBody')&&t.dataset.f){
    const i=+t.closest('tr').dataset.i,l=ui.pin.lines[i];l[t.dataset.f]=num(t.value);renderInLines();
  }
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(ui.modal){if(k==='Escape'){e.preventDefault();closeModal();return;}if(ui.mk)ui.mk(e);return;}
  const t=e.target;
  if(t.id==='entry'){
    if(k==='ArrowDown'&&ui.sugg.length){e.preventDefault();ui.sel=(ui.sel+1)%ui.sugg.length;$('#suggest').innerHTML=suggestHTML(ui.sugg,ui.sel,'sug');return;}
    if(k==='ArrowUp'&&ui.sugg.length){e.preventDefault();ui.sel=(ui.sel-1+ui.sugg.length)%ui.sugg.length;$('#suggest').innerHTML=suggestHTML(ui.sugg,ui.sel,'sug');return;}
    if(k==='Enter'){e.preventDefault();handleEntry();return;}
    if(k==='Escape'){t.value='';hideSuggest();return;}
  }
  if(t.id==='inEntry'){
    const P=ui.pin;
    if(k==='ArrowDown'&&P.sugg.length){e.preventDefault();P.sel=(P.sel+1)%P.sugg.length;$('#inSug').innerHTML=suggestHTML(P.sugg,P.sel,'insug');return;}
    if(k==='ArrowUp'&&P.sugg.length){e.preventDefault();P.sel=(P.sel-1+P.sugg.length)%P.sugg.length;$('#inSug').innerHTML=suggestHTML(P.sugg,P.sel,'insug');return;}
    if(k==='Enter'){e.preventDefault();const {t:q,qty}=parseEntry(t.value);if(!q)return;const p=exact(q)||search(q,6)[Math.min(P.sel,5)];if(p)addInLine(p,qty);else{beep(false);toast('No item found for “'+esc(q)+'”','err');}return;}
  }
  if(t.matches&&t.matches('#cartBody input')&&k==='Enter'){e.preventDefault();t.blur();setTimeout(()=>$('#entry').focus(),0);return;}
  if(t.dataset&&t.dataset.f&&(t.closest('#stockBody')||t.closest('#inBody'))&&k==='Enter'){e.preventDefault();t.blur();return;}
  if(ui.view!=='billing')return;
  if(k==='F1'){e.preventDefault();const en=$('#entry');en.focus();en.select();}
  else if(k==='F2'){e.preventDefault();setMode(cur().mode==='retail'?'wholesale':'retail');}
  else if(k==='F3'){e.preventDefault();holdNew();}
  else if(k==='F4'){e.preventDefault();nextBill();}
  else if(k==='F6'){e.preventDefault();$('#custName').focus();}
  else if(k==='F7'){e.preventDefault();$('#discVal').focus();$('#discVal').select();}
  else if(k==='F8'){e.preventDefault();removeLast();}
  else if(k==='F9'||k==='F10'){e.preventDefault();openPay();}
  else if(document.activeElement===document.body&&k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){$('#entry').focus();}
});
document.addEventListener('click',e=>{if(!e.target.closest('.entry')&&ui.view==='billing')hideSuggest();});

/* ---------- init ---------- */
db=loadDB();
if(!db||!Array.isArray(db.products))db=seedDB();
migrate();save();applyPaper();brand();tick();setInterval(tick,30000);
try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{dl=d;}).catch(()=>{});}catch(e){}
go('billing');
})();
